<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reward Welcome</title>
  <link rel="stylesheet" href="css/stylee.css">
</head>
<body>

<div class="background"></div>

<!-- Welcome Screen -->
<div class="container" id="welcomeBox">
  <h1>Welcome 🎉</h1>
  <p>Click below to reveal your reward</p>
  <button onclick="showReward()">Open Reward</button>
</div>

<!-- Reward Screen -->
<div class="reward hidden" id="rewardBox">
  <h1>You smile, You lose</h1>

  <video id="rewardVideo" controls>
    <source src="assets/funny.mp4" type="video/mp4">
    Your browser does not support video.
  </video>

  <p class="message"></p>
</div>

<script src="js/script.js"></script>
</body>
</html>
